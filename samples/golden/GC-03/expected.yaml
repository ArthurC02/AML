    - { field: 理由, value: 確認後符合, independentlyVerified: false }

retrieval:
  candidateRows: 2                           # with and without diacritics
  candidateProfiles: 1
  hitCount: 1

sourceConditions:
  - conditionType: OFFICIAL_WANTED_LIST      # OTHER_OFFICIAL_LIST refined by OfficialListPolicy
    status: HIT
    basis: CATEGORY_MAPPING
    legalStage: WANTED

identity:
  evidence:
    NAME: { direction: PREREQUISITE, comparisonStatus: EXACT }     # after diacritic folding
    GENDER: { direction: PREREQUISITE, comparisonStatus: EXACT }
    NATIONALITY: { direction: PREREQUISITE, comparisonStatus: EXACT }
    DATE_OF_BIRTH: { direction: SUPPORT, comparisonStatus: PARTIAL, strength: LOW, reasonCode: BIRTH_YEAR_MATCH_FULL_DATE_NOT_COMPARABLE }
    DOCUMENT: { comparisonStatus: PROFILE_MISSING }
    ADDRESS: { comparisonStatus: UNCERTAIN, effect: SOFT_DIFFERENCE }  # TW residence vs VN source address, periods unknown; not a hard exclusion
  stage1: no hard conflict
  stage3Row: 4
  identityDecision: PROBABLE_MATCH
  reasonCodes: [CONSISTENT_AT_AVAILABLE_PRECISION, NO_BILATERAL_DIRECT_IDENTIFIER]

pairResult: REVIEW                           # PROBABLE_MATCH is internal
disposition:
  article22_1: NOT_APPLICABLE                # not a PEP condition
caseStatus: IN_REVIEW
finalDisposition: { humanDecision: MATCH, disposition: ON_LIST, basis: IDENTITY }

regressionAssertions:
  - two rows (with and without diacritics) produce one hit
  - the DOB is never reported as a full-date match
  - different current and source countries of address never produce NO_MATCH
  - WANTED is never described as a conviction or judgment
  - legacy 確認後符合 never appears as evidence or SystemDecision
