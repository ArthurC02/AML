assumptions:
  - listFlags are MISSING; column order pending confirmation
  - the Profile's official-list details arrive as a structured 名單資訊 table (format assumed; real export pending)

extraction:
  customer:
    englishName: NGUYEN THI HONG NHUNG
    localName: { valueState: MISSING, detail: PLACEHOLDER_DASH }
    dateOfBirth: { value: 1992-04-10, precision: DAY }
    gender: FEMALE
    nationality: [VN]
    document: { type: TW_RESIDENT_CERTIFICATE, issuingCountry: TW, number: AC12345678 }   # fictional
    address: { raw: 33041桃園市桃園區中正路１００號, country: TW }
  profile:
    profileKey: DJ:90000031
    gender: FEMALE
    names: { primary: Nguyễn Thị Hồng Nhung, variants: [Nguyen Thi Hong Nhung] }
    dateOfBirth: { value: "1992", precision: YEAR }
    citizenship: [VN]
    address: { country: VN }
